<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">满水瓶细管温度计</title><desc id="desc">瓶内加满有色水，细管穿过密封瓶盖，下端距瓶底约一厘米，上端开口。细管水柱起始在盖上二至三厘米。试温水浴不超过瓶肩。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#555"/></marker></defs>
<rect width="900" height="430" fill="white"/>
<g font-family="Microsoft YaHei, sans-serif" fill="#222" font-size="19">
