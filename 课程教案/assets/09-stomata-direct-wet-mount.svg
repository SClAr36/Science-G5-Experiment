<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">薄叶直接湿装观察气孔</title>
  <desc id="desc">从吊竹梅等薄叶上避开主叶脉剪取两块小片，分别让上表面和下表面朝上，加水并盖盖玻片，在四十倍和一百倍显微镜下观察气孔。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfff6"/>
      <stop offset="1" stop-color="#f2f7ff"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8dc56f"/>
      <stop offset="1" stop-color="#4d9456"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3b536a"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="54" y="58" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#173d31">实验 3：薄叶直接湿装观察气孔</text>
  <text x="54" y="90" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#486273">thin leaf · observed surface faces up · wet mount</text>

  <g transform="translate(54 125)">
    <rect width="250" height="310" rx="20" fill="#fff" stroke="#cfddd2" stroke-width="2"/>
    <text x="20" y="38" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#173d31">1 · 剪两块薄叶</text>
    <path d="M30 180C78 78 193 78 225 164C174 224 87 236 30 180Z" fill="url(#leaf)" stroke="#387d49" stroke-width="4"/>
    <path d="M47 178C104 166 163 139 216 111" stroke="#dcefc8" stroke-width="5" fill="none"/>
    <rect x="93" y="111" width="68" height="46" rx="6" fill="#e9f6ff" fill-opacity=".65" stroke="#67a6c9" stroke-dasharray="6 4" stroke-width="3"/>
    <text x="44" y="256" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#486273">各约 3 mm × 5 mm</text>
    <text x="44" y="281" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#a34b40">避开主叶脉</text>
  </g>

  <path d="M320 280H365" stroke="#3b536a" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(375 125)">
    <rect width="250" height="310" rx="20" fill="#fff" stroke="#cfddd2" stroke-width="2"/>
    <text x="20" y="38" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#173d31">2 · 观察面朝上</text>
    <rect x="38" y="91" width="174" height="63" rx="8" fill="#77b961" stroke="#387d49" stroke-width="3"/>
    <circle cx="57" cy="122" r="16" fill="#e3a84e"/>
    <text x="57" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">U</text>
    <text x="89" y="128" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#173d31">上表面朝上</text>
    <rect x="38" y="183" width="174" height="63" rx="8" fill="#8d6db0" stroke="#67488c" stroke-width="3"/>
    <circle cx="57" cy="214" r="16" fill="#3c9a78"/>
    <text x="57" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">L</text>
    <text x="89" y="220" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#fff">下表面朝上</text>
    <path d="M125 76V57" stroke="#3b536a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="125" y="280" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#486273">物镜从上方观察</text>
  </g>

  <path d="M641 280H686" stroke="#3b536a" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(696 125)">
    <rect width="220" height="310" rx="20" fill="#fff" stroke="#cfddd2" stroke-width="2"/>
    <text x="20" y="38" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#173d31">3 · 做湿装片</text>
    <rect x="28" y="193" width="164" height="55" rx="7" fill="#e6f0f6" stroke="#65869a" stroke-width="3"/>
    <rect x="68" y="207" width="84" height="25" rx="4" fill="#78b962"/>
    <path d="M110 80C90 109 84 123 84 137C84 153 96 164 110 164C124 164 136 153 136 137C136 123 130 109 110 80Z" fill="#9bd4ef" stroke="#4a94b7" stroke-width="3"/>
    <rect x="57" y="174" width="106" height="9" rx="3" fill="#d8eff8" fill-opacity=".8" stroke="#5d8da3" stroke-width="2"/>
    <path d="M110 168V151" stroke="#3b536a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="39" y="279" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#486273">1 滴水 + 盖玻片</text>
  </g>

  <path d="M932 280H970" stroke="#3b536a" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(980 125)">
    <rect width="175" height="310" rx="20" fill="#fff" stroke="#cfddd2" stroke-width="2"/>
    <text x="18" y="38" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#173d31">4 · 找气孔</text>
    <circle cx="88" cy="141" r="67" fill="#eaf4dc" stroke="#789f65" stroke-width="4"/>
    <g fill="#b5d99b" stroke="#487a53" stroke-width="3">
      <path d="M52 120C32 100 35 75 58 77C76 80 80 106 63 122C58 127 56 127 52 120Z"/>
      <path d="M66 132C86 112 83 87 60 89C42 92 38 118 55 134C60 139 62 139 66 132Z"/>
      <path d="M104 151C84 131 87 106 110 108C128 111 132 137 115 153C110 158 108 158 104 151Z"/>
      <path d="M118 163C138 143 135 118 112 120C94 123 90 149 107 165C112 170 114 170 118 163Z"/>
    </g>
    <ellipse cx="59" cy="105" rx="5" ry="14" fill="#fff" stroke="#487a53" stroke-width="2"/>
    <ellipse cx="111" cy="136" rx="5" ry="14" fill="#fff" stroke="#487a53" stroke-width="2"/>
    <text x="30" y="236" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#486273">40× 定位</text>
    <text x="30" y="262" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#486273">100× 观察</text>
    <text x="30" y="288" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#a34b40">高倍只调细准焦</text>
  </g>

  <rect x="54" y="463" width="1101" height="38" rx="11" fill="#173d31"/>
  <text x="604" y="488" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#fff">要观察哪一面，就让哪一面朝上；直接湿装 2 min 仍不清楚，再换备用印迹。</text>
</svg>
