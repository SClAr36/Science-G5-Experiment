<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">空气进入水的折射实验侧视图</title>
  <desc id="desc">红色激光从水面上方的空气斜射入水，在空气水界面处向法线偏折；白纸只作背景，黑色挡光板只终止光束。</desc>
  <defs>
    <marker id="red-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#e1261c"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #17212b; }
      .title { font-size: 30px; font-weight: 800; }
      .label { font-size: 22px; font-weight: 700; }
      .note { font-size: 18px; font-weight: 600; }
      .small { font-size: 17px; font-weight: 600; }
      .light { fill: #ffffff; }
    </style>
  </defs>
  <rect width="1400" height="760" rx="24" fill="#f5f8fb"/>
  <text class="title" x="700" y="48" text-anchor="middle">空气进入水的折射：装置侧视图</text>

  <rect x="350" y="100" width="830" height="570" rx="16" fill="#ffffff" stroke="#9aa9b8" stroke-width="3" stroke-dasharray="10 8"/>
  <text class="note" x="1125" y="128" text-anchor="end">竖直 A3 白纸：背景与画线</text>

  <rect x="430" y="230" width="650" height="390" rx="18" fill="none" stroke="#52758f" stroke-width="8"/>
  <rect x="438" y="350" width="634" height="262" fill="#bfe8f5" opacity="0.82"/>
  <line x1="438" y1="350" x2="1072" y2="350" stroke="#2389b8" stroke-width="5"/>
  <text class="label" x="1000" y="330" text-anchor="end">空气 air</text>
  <text class="label" x="1000" y="392" text-anchor="end">水 water</text>
  <text class="note" x="1000" y="424" text-anchor="end">加 2–3 滴牛奶显示水中光路</text>
  <text class="note" x="755" y="340">水面 = 空气—水界面</text>

  <g transform="translate(260 55) rotate(28)">
    <rect x="0" y="0" width="230" height="62" rx="18" fill="#34495e"/>
    <rect x="205" y="17" width="48" height="28" rx="6" fill="#202d39"/>
    <circle cx="252" cy="31" r="7" fill="#e1261c"/>
    <text class="note light" x="105" y="40" text-anchor="middle">红色激光笔</text>
  </g>

  <line x1="490" y1="180" x2="650" y2="350" stroke="#e1261c" stroke-width="8" marker-end="url(#red-arrow)"/>
  <line x1="650" y1="350" x2="790" y2="610" stroke="#e1261c" stroke-width="8" marker-end="url(#red-arrow)"/>
  <circle cx="490" cy="180" r="10" fill="#ffffff" stroke="#17212b" stroke-width="4"/>
  <circle cx="650" cy="350" r="10" fill="#ffffff" stroke="#17212b" stroke-width="4"/>
  <circle cx="790" cy="610" r="10" fill="#ffffff" stroke="#17212b" stroke-width="4"/>
  <text class="label" x="505" y="174">P</text>
  <text class="label" x="625" y="340">O</text>
  <text class="label" x="805" y="606">Q</text>

  <line x1="650" y1="170" x2="650" y2="610" stroke="#2f3e4e" stroke-width="4" stroke-dasharray="12 10"/>
  <text class="label" x="670" y="205">法线 normal</text>
  <text class="note" x="430" y="255">从盒口上方直射水面：P—O</text>
  <text class="note" x="805" y="500">水中的折射光 O—Q</text>
  <text class="note" x="805" y="530">更靠近法线</text>

  <path d="M650 292 A58 58 0 0 0 597 326" fill="none" stroke="#6c4ccf" stroke-width="4"/>
  <text class="label" x="585" y="285">入射角 i</text>
  <path d="M650 408 A58 58 0 0 1 678 401" fill="none" stroke="#15815d" stroke-width="4"/>
  <text class="label" x="683" y="430">折射角 r</text>
  <text class="label" x="685" y="465">r &lt; i</text>

  <rect x="690" y="630" width="250" height="42" rx="8" fill="#222b35"/>
  <text class="note light" x="815" y="657" text-anchor="middle">黑色挡光板</text>
  <line x1="960" y1="650" x2="1135" y2="650" stroke="#3f4e5d" stroke-width="3"/>
  <text class="small" x="1145" y="644">只终止激光</text>
  <text class="small" x="1145" y="667">不参与折射或测量</text>

  <rect x="90" y="685" width="1220" height="54" rx="12" fill="#e8f1f7"/>
  <text class="label" x="700" y="720" text-anchor="middle">光从空气进入水，在水面 O 点折射；入射光不先穿过塑料盒壁</text>
</svg>
