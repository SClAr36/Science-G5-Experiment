<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">显微镜真实观察图与教材完整植物细胞模型对比</title>
  <desc id="desc">左侧是白洋葱表皮在普通光学显微镜下可能看到的规则细胞排列，清楚显示细胞壁，并把细胞核和液泡区标为可能看见或推断。右侧是典型绿色植物细胞教材模型，完整标出细胞壁、细胞膜、细胞质、细胞核、液泡、叶绿体、线粒体、内质网、高尔基体和核糖体。底部强调实验绘图只画实际观察到的结构。</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbfa"/>
      <stop offset="1" stop-color="#eef6f4"/>
    </linearGradient>
    <radialGradient id="scopeBg" cx="48%" cy="42%" r="62%">
      <stop offset="0" stop-color="#fffef8"/>
      <stop offset="1" stop-color="#e8ece8"/>
    </radialGradient>
    <linearGradient id="vacuoleFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf8fc"/>
      <stop offset="1" stop-color="#cfeaf3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18333a" flood-opacity="0.12"/>
    </filter>
    <clipPath id="scopeClip">
      <circle cx="350" cy="410" r="214"/>
    </clipPath>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#385c65"/>
    </marker>
  </defs>
  <style>
    text{font-family:"Noto Sans SC","Microsoft YaHei","Segoe UI",sans-serif;fill:#172b32}
    .main-title{font-size:30px;font-weight:700;fill:#164d58}
    .subtitle{font-size:17px;font-weight:500;fill:#587078}
    .panel{fill:#ffffff;stroke:#c8d9d6;stroke-width:2}
    .panel-title{font-size:24px;font-weight:700;fill:#164d58}
    .panel-sub{font-size:16px;font-weight:500;fill:#6a7e84}
    .label{font-size:18px;font-weight:700}
    .label-en{font-size:14px;font-weight:500;fill:#65777d}
    .callout{fill:none;stroke:#385c65;stroke-width:2;marker-end:url(#arrow)}
    .small-note{font-size:15px;font-weight:500;fill:#53696f}
    .badge{fill:#e6f3ef;stroke:#8bb8ad;stroke-width:1.5}
    .badge-text{font-size:17px;font-weight:700;fill:#20594f}
    .wall{fill:#fff6d7;stroke:#a8753c;stroke-width:7}
    .cell-inner{fill:#fbfdfc;fill-opacity:.88;stroke:none}
    .model-wall{fill:#dceec8;stroke:#537b3e;stroke-width:11}
    .model-membrane{fill:#fbf8d9;stroke:#3d9091;stroke-width:5}
    .organelle-line{fill:none;stroke-width:3;stroke-linecap:round}
  </style>

  <rect width="1400" height="850" fill="url(#pageBg)"/>
  <text x="700" y="45" text-anchor="middle" class="main-title">真实观察图 ≠ 教材完整模型</text>
  <text x="700" y="76" text-anchor="middle" class="subtitle">左边回答“这一次我看见了什么”，右边回答“一个典型植物细胞还包含什么”</text>

  <rect x="28" y="105" width="656" height="650" rx="22" class="panel" filter="url(#shadow)"/>
  <rect x="716" y="105" width="656" height="650" rx="22" class="panel" filter="url(#shadow)"/>

  <text x="356" y="145" text-anchor="middle" class="panel-title">显微镜真实观察：白洋葱表皮</text>
  <text x="356" y="174" text-anchor="middle" class="panel-sub">ordinary light microscope · 约 100×–400×</text>

  <circle cx="350" cy="410" r="221" fill="url(#scopeBg)" stroke="#59696c" stroke-width="8"/>
  <g clip-path="url(#scopeClip)">
    <rect x="118" y="185" width="465" height="450" fill="#f5f0dc"/>

    <g transform="rotate(-2 350 410)">
      <rect x="125" y="220" width="145" height="112" rx="12" class="wall"/>
      <rect x="270" y="220" width="155" height="112" rx="11" class="wall"/>
      <rect x="425" y="220" width="150" height="112" rx="13" class="wall"/>
      <rect x="125" y="332" width="145" height="120" rx="10" class="wall"/>
      <rect x="270" y="332" width="155" height="120" rx="12" class="wall"/>
      <rect x="425" y="332" width="150" height="120" rx="10" class="wall"/>
      <rect x="125" y="452" width="145" height="118" rx="13" class="wall"/>
      <rect x="270" y="452" width="155" height="118" rx="10" class="wall"/>
      <rect x="425" y="452" width="150" height="118" rx="12" class="wall"/>

      <rect x="140" y="236" width="114" height="80" rx="18" class="cell-inner"/>
      <rect x="286" y="236" width="123" height="80" rx="18" class="cell-inner"/>
      <rect x="441" y="236" width="118" height="80" rx="18" class="cell-inner"/>
      <rect x="140" y="348" width="114" height="88" rx="18" class="cell-inner"/>
      <rect x="286" y="348" width="123" height="88" rx="18" class="cell-inner"/>
      <rect x="441" y="348" width="118" height="88" rx="18" class="cell-inner"/>
      <rect x="140" y="468" width="114" height="86" rx="18" class="cell-inner"/>
      <rect x="286" y="468" width="123" height="86" rx="18" class="cell-inner"/>
      <rect x="441" y="468" width="118" height="86" rx="18" class="cell-inner"/>

      <g fill="#8b668b" opacity="0.66">
        <ellipse cx="310" cy="393" rx="12" ry="9"/>
        <ellipse cx="501" cy="292" rx="11" ry="8"/>
        <ellipse cx="210" cy="510" rx="10" ry="8"/>
      </g>
      <g fill="#ffffff" opacity="0.55">
        <ellipse cx="225" cy="385" rx="28" ry="40"/>
        <ellipse cx="369" cy="510" rx="30" ry="38"/>
        <ellipse cx="503" cy="390" rx="26" ry="40"/>
      </g>
    </g>
  </g>

  <path d="M102 238 C150 245 167 270 188 300" class="callout"/>
  <text x="61" y="217" class="label">清楚：细胞壁</text>
  <text x="61" y="238" class="label-en">cell wall</text>

  <path d="M115 647 C175 616 242 526 304 399" class="callout"/>
  <text x="56" y="664" class="label">可能：细胞核</text>
  <text x="56" y="686" class="label-en">nucleus（有对比液时）</text>

  <path d="M585 642 C553 610 522 545 503 405" class="callout"/>
  <text x="470" y="663" class="label">推断：大液泡区</text>
  <text x="492" y="685" class="label-en">vacuole region</text>

  <rect x="192" y="707" width="326" height="34" rx="17" class="badge"/>
  <text x="355" y="730" text-anchor="middle" class="badge-text">细胞膜通常不能与细胞壁分开看清</text>

  <text x="1044" y="145" text-anchor="middle" class="panel-title">教材完整模型：典型绿色植物细胞</text>
  <text x="1044" y="174" text-anchor="middle" class="panel-sub">not one microscope view · 综合许多研究证据</text>

  <rect x="838" y="228" width="420" height="340" rx="74" class="model-wall"/>
  <rect x="856" y="246" width="384" height="304" rx="61" class="model-membrane"/>

  <rect x="970" y="292" width="178" height="205" rx="70" fill="url(#vacuoleFill)" stroke="#69a9ba" stroke-width="4"/>
  <ellipse cx="920" cy="378" rx="56" ry="49" fill="#c8add5" stroke="#6d5278" stroke-width="5"/>
  <circle cx="920" cy="378" r="16" fill="#76517e"/>

  <g fill="#78b85d" stroke="#387441" stroke-width="3">
    <ellipse cx="921" cy="283" rx="36" ry="18" transform="rotate(-12 921 283)"/>
    <ellipse cx="1182" cy="292" rx="36" ry="18" transform="rotate(14 1182 292)"/>
    <ellipse cx="1194" cy="505" rx="36" ry="18" transform="rotate(-14 1194 505)"/>
    <ellipse cx="910" cy="506" rx="36" ry="18" transform="rotate(10 910 506)"/>
  </g>
  <g stroke="#d7efd2" stroke-width="3">
    <path d="M892 282 Q921 270 950 282"/>
    <path d="M1153 292 Q1182 280 1211 292"/>
    <path d="M1165 505 Q1194 493 1223 505"/>
    <path d="M881 506 Q910 494 939 506"/>
  </g>

  <g fill="#efb16d" stroke="#a85c2d" stroke-width="3">
    <path d="M1164 347 C1195 329 1223 347 1210 375 C1196 401 1157 390 1157 367 C1157 359 1159 352 1164 347 Z"/>
    <path d="M875 447 C903 429 933 445 922 472 C911 497 873 492 867 468 C865 460 868 452 875 447 Z"/>
  </g>
  <g class="organelle-line" stroke="#a85c2d">
    <path d="M1170 360 Q1186 347 1201 365 Q1187 380 1168 370"/>
    <path d="M878 461 Q892 447 910 464 Q895 480 877 470"/>
  </g>

  <g class="organelle-line" stroke="#8b64a1">
    <path d="M944 356 C967 343 987 345 1004 356"/>
    <path d="M944 368 C969 356 990 359 1008 370"/>
    <path d="M944 381 C966 371 987 374 1004 386"/>
    <path d="M943 394 C963 386 982 389 998 400"/>
  </g>
  <g fill="#684f78">
    <circle cx="957" cy="350" r="3.5"/><circle cx="978" cy="351" r="3.5"/><circle cx="994" cy="360" r="3.5"/>
    <circle cx="961" cy="374" r="3.5"/><circle cx="988" cy="382" r="3.5"/><circle cx="1000" cy="397" r="3.5"/>
    <circle cx="1090" cy="266" r="4"/><circle cx="1110" cy="273" r="4"/><circle cx="1130" cy="260" r="4"/>
    <circle cx="1160" cy="531" r="4"/><circle cx="1134" cy="520" r="4"/>
  </g>

  <g class="organelle-line" stroke="#c27679">
    <path d="M1155 413 C1182 398 1210 401 1228 412"/>
    <path d="M1158 426 C1184 412 1210 415 1225 425"/>
    <path d="M1161 439 C1185 426 1207 429 1221 438"/>
    <path d="M1165 452 C1186 441 1203 443 1217 451"/>
  </g>
  <g fill="#d99a9a">
    <circle cx="1236" cy="410" r="6"/><circle cx="1231" cy="431" r="5"/><circle cx="1225" cy="452" r="5"/>
  </g>

  <path d="M794 202 L848 241" class="callout"/>
  <text x="744" y="194" class="label">细胞壁</text>
  <text x="744" y="215" class="label-en">cell wall</text>

  <path d="M932 204 L952 260" class="callout"/>
  <text x="899" y="194" class="label">细胞质</text>
  <text x="899" y="215" class="label-en">cytoplasm</text>

  <path d="M1210 203 L1187 276" class="callout"/>
  <text x="1177" y="194" class="label">叶绿体</text>
  <text x="1177" y="215" class="label-en">chloroplast</text>

  <path d="M800 362 L868 372" class="callout"/>
  <text x="738" y="327" class="label">细胞核（含核仁）</text>
  <text x="738" y="348" class="label-en">nucleus + nucleolus</text>

  <path d="M782 450 L949 390" class="callout"/>
  <text x="738" y="437" class="label">内质网</text>
  <text x="738" y="458" class="label-en">endoplasmic reticulum</text>

  <path d="M794 586 L860 536" class="callout"/>
  <text x="739" y="584" class="label">细胞膜</text>
  <text x="739" y="605" class="label-en">cell membrane</text>

  <path d="M1056 609 L1058 486" class="callout"/>
  <text x="1023" y="633" class="label">大液泡</text>
  <text x="1024" y="654" class="label-en">large vacuole</text>

  <path d="M1284 352 L1212 363" class="callout"/>
  <text x="1255" y="333" class="label">线粒体</text>
  <text x="1255" y="354" class="label-en">mitochondrion</text>

  <path d="M1292 438 L1217 433" class="callout"/>
  <text x="1261" y="419" class="label">高尔基体</text>
  <text x="1261" y="440" class="label-en">Golgi apparatus</text>

  <path d="M1290 531 L1134 520" class="callout"/>
  <text x="1260" y="512" class="label">核糖体</text>
  <text x="1260" y="533" class="label-en">ribosome</text>

  <text x="1044" y="697" text-anchor="middle" class="small-note">*右图是典型绿色植物细胞；洋葱鳞片细胞通常没有叶绿体。</text>
  <rect x="820" y="711" width="448" height="34" rx="17" class="badge"/>
  <text x="1044" y="734" text-anchor="middle" class="badge-text">模型展示完整结构，但不是一次显微镜观察结果</text>

  <path d="M80 805 H1320" stroke="#94aaa7" stroke-width="2"/>
  <text x="700" y="832" text-anchor="middle" class="label">实验记录只画左图中真正看到的结构；右图用于理解细胞的完整组成。</text>
</svg>
