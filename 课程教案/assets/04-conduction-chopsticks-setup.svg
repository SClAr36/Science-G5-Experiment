<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">实验 2 三种家用筷子的传导比较</title>
  <desc id="desc">不锈钢筷、竹木筷和塑料密胺筷穿过快递箱纸板上的三条短缝，粗端同时浸入五十到五十五摄氏度温水三十毫米。每根筷子在水面上方三十毫米处用米粒大小黄油粘八毫米纸旗。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #17324d; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 650; }
      .small { font-size: 18px; }
      .dim { stroke: #576b7d; stroke-width: 2; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .guide { stroke: #8a9aaa; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#576b7d"/>
    </marker>
    <linearGradient id="water" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c9eef7"/><stop offset="1" stop-color="#84d3e6"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="1">
      <stop offset="0" stop-color="#9eabb5"/><stop offset="0.5" stop-color="#eef3f6"/><stop offset="1" stop-color="#7d8d99"/>
    </linearGradient>
  </defs>

  <text x="550" y="48" text-anchor="middle" class="title">实验 2：三种家用筷子，共用同一温水浴</text>

  <path d="M175 408 L205 625 Q210 655 240 655 L860 655 Q890 655 895 625 L925 408 Z" fill="#f7fbfd" stroke="#55768c" stroke-width="5"/>
  <path d="M198 448 L223 622 Q226 632 240 632 L860 632 Q874 632 877 622 L902 448 Z" fill="url(#water)" opacity=".94"/>
  <line x1="198" y1="448" x2="902" y2="448" stroke="#2498b9" stroke-width="4"/>
  <text x="785" y="492" class="label">约 400 mL 温水</text>
  <text x="785" y="522" class="small">50–55°C</text>

  <rect x="170" y="397" width="760" height="30" rx="8" fill="#d7b98a" stroke="#8b6c42" stroke-width="3"/>
  <line x1="344" y1="397" x2="366" y2="427" stroke="#725b3c" stroke-width="4"/>
  <line x1="539" y1="397" x2="561" y2="427" stroke="#725b3c" stroke-width="4"/>
  <line x1="734" y1="397" x2="756" y2="427" stroke="#725b3c" stroke-width="4"/>
  <text x="942" y="418" class="small">快递箱纸板三条短缝</text>

  <path d="M350 92 L365 510" stroke="url(#steel)" stroke-width="18" stroke-linecap="round"/>
  <path d="M545 92 L560 510" stroke="#c69258" stroke-width="18" stroke-linecap="round"/>
  <path d="M550 110 C558 150 548 190 557 235 C549 285 560 330 552 380" stroke="#8f6034" stroke-width="2" fill="none" opacity=".7"/>
  <path d="M740 92 L755 510" stroke="#557f96" stroke-width="18" stroke-linecap="round"/>

  <g>
    <circle cx="360" cy="385" r="9" fill="#f4c75b" stroke="#9b7422" stroke-width="2"/>
    <rect x="369" y="376" width="18" height="18" rx="2" fill="#fff8dc" stroke="#b19b62" stroke-width="2"/>
    <circle cx="555" cy="385" r="9" fill="#f4c75b" stroke="#9b7422" stroke-width="2"/>
    <rect x="564" y="376" width="18" height="18" rx="2" fill="#fff8dc" stroke="#b19b62" stroke-width="2"/>
    <circle cx="750" cy="385" r="9" fill="#f4c75b" stroke="#9b7422" stroke-width="2"/>
    <rect x="759" y="376" width="18" height="18" rx="2" fill="#fff8dc" stroke="#b19b62" stroke-width="2"/>
  </g>

  <text x="355" y="78" text-anchor="middle" class="label">不锈钢筷</text>
  <text x="550" y="78" text-anchor="middle" class="label">竹筷 / 木筷</text>
  <text x="745" y="78" text-anchor="middle" class="label">塑料 / 密胺筷</text>

  <line x1="830" y1="385" x2="830" y2="448" class="dim"/>
  <text x="810" y="360" text-anchor="end" class="small">水面上方 30 mm</text>
  <line x1="945" y1="448" x2="945" y2="510" class="dim"/>
  <text x="965" y="485" class="small">浸水 30 mm</text>

  <rect x="815" y="195" width="260" height="108" rx="10" fill="#fffaf0" stroke="#b19b62" stroke-width="2"/>
  <circle cx="845" cy="247" r="10" fill="#f4c75b" stroke="#9b7422" stroke-width="2"/>
  <rect x="855" y="228" width="36" height="36" rx="3" fill="#fff8dc" stroke="#b19b62" stroke-width="2"/>
  <text x="907" y="225" class="small">黄油：米粒大小</text>
  <text x="907" y="252" class="small">纸旗：8 × 8 mm</text>
  <text x="907" y="279" class="small">三处等高、等量</text>
  <line x1="777" y1="385" x2="825" y2="303" class="guide"/>

  <text x="550" y="695" text-anchor="middle" class="label">尽量选长度、粗细接近的筷子；结论只针对这三个具体物体</text>
</svg>
